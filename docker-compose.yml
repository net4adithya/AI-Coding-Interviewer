services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sandbox-worker:
    build:
      context: ./python_backend
      dockerfile: Dockerfile.sandbox-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      SANDBOX_ENABLED: "true"
      EXECUTION_TIMEOUT_SEC: "10"
      EXECUTION_MEMORY_MB: "256"
      EXECUTION_CPUS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
